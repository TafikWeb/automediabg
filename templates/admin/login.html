<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход · Админ AutoMediaBG</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0b; --surface:#141416; --line:#28282c; --white:#f4f4f2; --gray:#9a9aa0; --red:#e2222c;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--white); font-family:'Manrope',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh;}
  form{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:40px; width:340px;}
  .logo{font-family:'Archivo Black'; font-size:20px; margin-bottom:30px; text-align:center;}
  .logo span{color:var(--red);}
  label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gray); font-weight:700; margin-bottom:8px; display:block;}
  input{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--white); padding:12px 14px; font-size:14px; border-radius:3px; margin-bottom:18px;}
  button{width:100%; background:var(--red); color:#fff; border:none; padding:14px; font-weight:800; text-transform:uppercase; letter-spacing:1px; border-radius:4px; cursor:pointer;}
  .flash{background:rgba(226,34,44,0.15); color:#ff9aa0; padding:10px 14px; border-radius:4px; margin-bottom:16px; font-size:13px;}
</style>
</head>
<body>
<form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="logo">AUTO<span>MEDIA</span>BG · Админ</div>
  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}
  <label>Потребител</label>
  <input type="text" name="username" required>
  <label>Парола</label>
  <input type="password" name="password" required>
  <button type="submit">Вход</button>
</form>
</body>
</html>
